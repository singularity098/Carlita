name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          echo "jackd2 jackd/tweak_rt_limits boolean false" | sudo debconf-set-selections
          sudo apt-get update
          sudo apt-get install -y carla carla-dev libclang-dev clang jackd2 xvfb \
            libasound2-dev libxkbcommon-dev libfontconfig-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Start a dummy JACK server
        run: |
          jackd --no-realtime -d dummy -r 48000 -p 256 &
          sleep 2
      - name: Test
        env:
          CARLITA_REQUIRE_ENGINE: "1"
        run: xvfb-run -a -s "-screen 0 1280x800x24 +extension Composite" cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets

  # Builds the AppImage on every push and pull request and keeps it as a
  # workflow artifact; tags starting with "v" also attach it to a release.
  appimage:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y carla carla-dev libclang-dev clang libasound2-dev \
            libxkbcommon-dev libfontconfig-dev libfuse2t64 file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: appimage
      - name: Build AppImage
        run: packaging/appimage/build-appimage.sh
      - name: Smoke test
        run: APPIMAGE_EXTRACT_AND_RUN=1 ./dist/*.AppImage --version
      - uses: actions/upload-artifact@v4
        with:
          name: Carlita-AppImage
          path: dist/*.AppImage
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage
