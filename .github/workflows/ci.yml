name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          echo "jackd2 jackd/tweak_rt_limits boolean false" | sudo debconf-set-selections
          sudo apt-get update
          sudo apt-get install -y libclang-dev clang jackd2 xvfb \
            libasound2-dev libxkbcommon-dev libfontconfig-dev
          # To build Carla (see packaging/build-carla.sh).
          sudo apt-get install -y pkg-config libx11-dev libxcursor-dev libxext-dev \
            libgl-dev libfreetype-dev liblo-dev libmagic-dev libsndfile1-dev \
            libfluidsynth-dev libjack-jackd2-dev libmpg123-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: ~/carla-build
          key: carla-${{ hashFiles('packaging/build-carla.sh', 'packaging/appimage/carla-patches/*') }}
      - name: Carla
        run: |
          prefix="$(CARLA_BUILD_DIR=$HOME/carla-build packaging/build-carla.sh)"
          echo "CARLA_INCLUDE_DIR=$prefix/include/carla" >> "$GITHUB_ENV"
          echo "CARLA_LIB_DIR=$prefix/lib/carla" >> "$GITHUB_ENV"
          echo "CARLA_BUILD_DIR=$HOME/carla-build" >> "$GITHUB_ENV"
      - name: Start a dummy JACK server
        run: |
          jackd --no-realtime -d dummy -r 48000 -p 256 &
          sleep 2
      - name: Test
        env:
          CARLITA_REQUIRE_ENGINE: "1"
        run: xvfb-run -a -s "-screen 0 1280x800x24 -noreset" cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets

  # Builds the AppImage on every push and pull request and keeps it as a
  # workflow artifact; tags starting with "v" also attach it to a release.
  appimage:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev clang libasound2-dev \
            libxkbcommon-dev libfontconfig-dev libfuse2t64 file patchelf
          # To build Carla (see packaging/build-carla.sh).
          sudo apt-get install -y pkg-config libx11-dev libxcursor-dev libxext-dev \
            libgl-dev libfreetype-dev liblo-dev libmagic-dev libsndfile1-dev \
            libfluidsynth-dev libjack-jackd2-dev libmpg123-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: appimage
      - uses: actions/cache@v4
        with:
          path: ~/carla-build
          key: carla-${{ hashFiles('packaging/build-carla.sh', 'packaging/appimage/carla-patches/*') }}
      - name: Carla
        run: |
          prefix="$(CARLA_BUILD_DIR=$HOME/carla-build packaging/build-carla.sh)"
          echo "CARLA_INCLUDE_DIR=$prefix/include/carla" >> "$GITHUB_ENV"
          echo "CARLA_LIB_DIR=$prefix/lib/carla" >> "$GITHUB_ENV"
          echo "CARLA_BUILD_DIR=$HOME/carla-build" >> "$GITHUB_ENV"
      - name: Build AppImage
        run: packaging/appimage/build-appimage.sh
      - name: Smoke test
        run: APPIMAGE_EXTRACT_AND_RUN=1 ./dist/*.AppImage --version
      - uses: actions/upload-artifact@v4
        with:
          name: Carlita-AppImage
          path: dist/*.AppImage
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage
