[package]
name = "carlita-x11"
description = "Captures fixed-size X11 plugin editors off-screen (XComposite) and forwards touch input to them"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
log.workspace = true
crossbeam-channel.workspace = true
x11rb = { version = "0.13", features = ["composite", "damage", "xtest"] }

[dev-dependencies]
x11rb = { version = "0.13", features = ["composite", "damage", "xtest"] }
