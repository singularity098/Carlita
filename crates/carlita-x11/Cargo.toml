[package]
name = "carlita-x11"
description = "Shows X11 plugin editors inside Carlita's window by reparenting them"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
log.workspace = true
crossbeam-channel.workspace = true
x11rb = "0.13"

[dev-dependencies]
# Fakes clicks and key presses in the embedding test.
x11rb = { version = "0.13", features = ["xtest"] }
